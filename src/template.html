<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diogo Martins</title>
<style>
:root {
  --bg: #0f0e0c;
  --fg: #e6e0d4;
  --muted: #8a8378;
  --rule: #26231f;
  --accent: #d9b56a;
  --font: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --mono: "SF Mono", Menlo, Consolas, monospace;
}
html[data-theme="light"] {
  --bg: #f4eddc;
  --fg: #1e1b16;
  --muted: #736c5f;
  --rule: #e0d7c3;
  --accent: #8a6a1c;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { overflow-anchor: none; }
body { min-height: 100svh; display: flex; flex-direction: column; }
.wrap { flex: 1; width: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  transition: background .25s, color .25s;
}
a { color: inherit; text-decoration: underline; text-decoration-color: var(--muted); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.wrap { max-width: 44rem; margin: 0 auto; padding: 0 1.5rem 3rem; }
header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 10;
  background: transparent;
  border-bottom: 1px solid transparent;
  transition: border-color .35s ease;
}
.header-slot {
  flex-shrink: 0;
  pointer-events: none;
  overflow-anchor: none;
  height: 9.5rem;
}
header::before {
  content: "";
  position: absolute; inset: 0;
  pointer-events: none;
  background: color-mix(in srgb, var(--bg) 72%, transparent);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  backdrop-filter: blur(14px) saturate(140%);
  opacity: 0;
  transition: opacity .35s ease;
}
header .inner {
  position: relative;
  max-width: 44rem; margin: 0 auto; padding: 4rem 1.5rem 1rem;
  display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
  transition: padding .35s ease;
}
.brand a { text-decoration: none; font-style: italic; font-size: 1.7rem; display: inline-block; transition: font-size .35s ease; }
.brand span {
  display: grid; grid-template-rows: 1fr; color: var(--muted); font-size: 1rem; font-style: italic; margin-top: .1rem;
  transition: grid-template-rows .35s ease, opacity .2s ease .12s;
}
.brand span > em { font-style: inherit; overflow: hidden; min-height: 0; }
header.scrolled {
  border-bottom-color: color-mix(in srgb, var(--rule) 70%, transparent);
}
header.scrolled::before { opacity: 1; }
header.scrolled .inner { padding: .85rem 1.5rem; }
header.scrolled .brand a { font-size: 1.15rem; }
header.scrolled .brand span {
  grid-template-rows: 0fr; opacity: 0;
  transition: grid-template-rows .35s ease, opacity .1s ease;
}
nav { display: flex; gap: 1.25rem; align-items: center; }
nav a { text-decoration: none; color: var(--muted); }
nav a[aria-current="page"], nav a:hover { color: var(--fg); }
#theme {
  background: none; border: 1px solid var(--muted); border-radius: 50%;
  width: 18px; height: 18px; padding: 0; cursor: pointer; display: block; position: relative;
}
#theme::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--fg); }
html[data-theme="light"] #theme::after { inset: 3px 3px 3px 8px; border-radius: 0 50% 50% 0; }
main { margin-top: 5rem; }
main.leaving { opacity: 0; transform: translateY(4px); }
main { transition: opacity .18s ease, transform .18s ease; }
article, .list, .empty { margin-bottom: 4rem; }
h1 { font-weight: normal; font-size: 2rem; letter-spacing: -.01em; margin: 0 0 1.5rem; line-height: 1.15; }
h2 { font-weight: normal; font-size: 1.05rem; color: var(--muted); margin: 3rem 0 .75rem; font-style: italic; }
ul { padding-left: 1.2rem; margin: 0; }
li { margin: .2rem 0; }
.home ul { list-style: "— "; }
.home .bio { list-style: none; padding: 0; }
.home .bio li { display: flex; align-items: center; gap: .75rem; margin: .45rem 0; }
.home .bio svg { width: 1.15rem; height: 1.15rem; flex-shrink: 0; color: var(--muted); }
.list { list-style: none; padding: 0; }
.list li { display: flex; gap: 1.5rem; align-items: baseline; margin: .55rem 0; }
.list time { color: var(--muted); font-family: var(--mono); font-size: .8rem; flex: 0 0 5.5rem; }
.list a { text-decoration: none; }
.list a:hover { text-decoration: underline; }
.list .tags { margin-left: auto; flex-shrink: 0; }
.tags { display: flex; flex-wrap: wrap; gap: .35rem .6rem; font-family: var(--mono); font-size: .75rem; color: var(--muted); }
.tags a { text-decoration: none; color: inherit; }
.tags a::before { content: "#"; opacity: .6; }
.tags a:hover, .tags a.active { color: var(--fg); }
.tags a.active::before { color: var(--accent); opacity: 1; }
.filter { margin: -.75rem 0 2rem; }
.filter a { padding: .15rem 0; }
article .tags { margin: -2rem 0 2.5rem; }
.empty { color: var(--muted); }
@media (max-width: 40rem) { .home { min-height: calc(100svh - 11rem); } .list li { flex-wrap: wrap; row-gap: .1rem; } .list .tags { margin-left: 7rem; width: 100%; } }
article p { margin: 0 0 1.2rem; }
article h2 { font-style: normal; color: var(--fg); font-size: 1.15rem; margin: 2.2rem 0 .6rem; }
article ul { margin: 0 0 1.2rem; }
article blockquote {
  margin: 2rem 0;
  padding: .2rem 0 .2rem 1.25rem;
  border-left: 2px solid var(--accent);
  color: var(--muted);
  font-style: italic;
}
article blockquote p { margin-bottom: 1rem; }
article blockquote p:last-child { margin-bottom: 0; }
article ol { margin: 0 0 1.2rem; padding-left: 1.5rem; }
article li:has(> input[type="checkbox"]) { list-style: none; margin-left: -1.2rem; }
article input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;
  display: inline-grid;
  width: .9rem;
  height: .9rem;
  margin: 0 .55rem 0 0;
  padding: 0;
  border: 1px solid var(--muted);
  border-radius: 2px;
  background: transparent;
  vertical-align: -.1em;
  place-content: center;
}
article input[type="checkbox"]::before {
  content: "";
  width: .42rem;
  height: .23rem;
  border: solid var(--bg);
  border-width: 0 0 2px 2px;
  transform: rotate(-45deg) scale(0);
  transition: transform .12s ease;
}
article input[type="checkbox"]:checked { border-color: var(--accent); background: var(--accent); }
article input[type="checkbox"]:checked::before { transform: rotate(-45deg) scale(1); }
article input[type="checkbox"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
article table { display: block; width: 100%; overflow-x: auto; border-collapse: collapse; margin: 0 0 1.5rem; font-size: .92em; }
article th, article td { padding: .55rem .75rem; border-bottom: 1px solid var(--rule); text-align: left; white-space: nowrap; }
article th { color: var(--fg); font-weight: normal; }
article thead th { border-bottom-color: var(--accent); }
article img { display: block; max-width: 100%; height: auto; margin: 2rem auto; }
article hr { border: 0; border-top: 1px solid var(--rule); margin: 2.5rem 0; }
pre { background: var(--rule); padding: .9rem 1rem; border-radius: 4px; overflow-x: auto; font-family: var(--mono); font-size: .82rem; line-height: 1.5; margin: 0 0 1.4rem; }
code { font-family: var(--mono); font-size: .85em; }
pre code { font-size: inherit; background: none; padding: 0; }
p code { background: var(--rule); padding: .1em .35em; border-radius: 3px; }
.pager { margin-top: 2.5rem; margin-bottom: 0; padding-top: 1.25rem; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; gap: 2rem; font-size: .9rem; }
.pager a { text-decoration: none; display: flex; flex-direction: column; gap: .15rem; max-width: 48%; }
.pager a.older { text-align: right; margin-left: auto; }
.pager small { color: var(--muted); font-size: .8rem; }
.pager a:hover span { text-decoration: underline; }
article h1 { margin-bottom: .25rem; }
article > time { color: var(--muted); font-family: var(--mono); font-size: .8rem; display: block; margin-bottom: 2.5rem; }
.back { display: inline-block; margin-bottom: 2rem; color: var(--muted); text-decoration: none; }
.back:hover { color: var(--fg); }
footer { max-width: 44rem; width: 100%; margin: 0 auto; padding: 1.5rem 1.5rem 2rem; color: var(--muted); font-size: .85rem; display: flex; gap: 1.25rem; align-items: baseline; }
footer .clock { margin-left: auto; font-family: var(--mono); font-size: .8rem; }
footer .clock b { font-weight: normal; color: var(--fg); }
footer a { text-decoration: none; }
footer a:hover { text-decoration: underline; }
@media (prefers-reduced-motion: reduce) { body, main, header, header::before, header *, .brand span { transition: none; } }
</style>
</head>
<body>
<header>
  <div class="inner">
    <div class="brand">
      <a href="#/">Diogo Martins</a>
      <span><em>Notes on whatever is on my mind.</em></span>
    </div>
    <nav>
      <a href="#/writings" data-route="writings">writings</a>
      <a href="#/notes" data-route="notes">notes</a>
      <button id="theme" aria-label="Toggle theme"></button>
    </nav>
  </div>
</header>
<div class="header-slot" aria-hidden="true"></div>
<div class="wrap">
  <main id="main"></main>
</div>
<footer>
  <a href="https://github.com/DiogoM14/dxmm" target="_blank" rel="noopener">source</a>
  <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">cc by-sa 4.0</a>
  <span class="clock">Portugal <b id="clock"></b></span>
</footer>

<script>
/*__CONTENT__*/

const collections = { writings, notes };

const tagLink = (section, t, active) =>
  `<a href="#/${section}${active === t ? "" : `?tag=${t}`}" class="${active === t ? "active" : ""}">${t}</a>`;

const listView = (section, tag) => {
  const items = collections[section];
  const tags = [...new Set(items.flatMap(i => i.tags))].sort();
  const shown = tag ? items.filter(i => i.tags.includes(tag)) : items;
  return `
    <h1>${section[0].toUpperCase() + section.slice(1)}</h1>
    <div class="tags filter">${tags.map(t => tagLink(section, t, tag)).join("")}</div>
    ${shown.length ? `<ul class="list">
      ${shown.map(i => `<li><time>${i.date}</time><a href="#/${section}/${i.slug}">${i.title}</a>
        <span class="tags">${i.tags.map(t => tagLink(section, t, tag)).join("")}</span></li>`).join("")}
    </ul>` : `<p class="empty">Nothing tagged #${tag} yet.</p>`}`;
};

const svg = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const icons = {
  gym: svg('<path d="M3 10v4M6 8v8M18 8v8M21 10v4M6 12h12"/>'),
  code: svg('<path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/>'),
  work: svg('<rect x="3" y="5" width="18" height="12" rx="1.5"/><path d="M8 21h8M12 17v4M7 13l3-3 3 2 4-4"/>'),
  learn: svg('<path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H20v14H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20M8 8h8"/>'),
};

const views = {
  home: () => `
    <div class="home">
      <ul class="bio">
        <li>${icons.gym}<span>like the gym</span></li>
        <li>${icons.code}<span>like coding</span></li>
        <li>${icons.work}<span>working at <a href="https://www.it-objects.de/en" target="_blank" rel="noopener">it-objects</a> on the front end</span></li>
        <li>${icons.learn}<span>learning product management and <a href="https://basecamp.com/shapeup" target="_blank" rel="noopener">Shape Up</a></span></li>
      </ul>
      <h2>find me on</h2>
      <ul>
        <li><a href="https://github.com/DiogoM14" target="_blank" rel="noopener">Github</a></li>
        <li><a href="https://x.com/Diogo14M" target="_blank" rel="noopener">X</a></li>
      </ul>
    </div>`,
  writings: (tag) => listView("writings", tag),
  notes: (tag) => listView("notes", tag),
  post: (section, slug) => {
    const items = collections[section];
    const i = items.findIndex(x => x.slug === slug);
    if (i < 0) return `<p>Nothing here. <a href="#/${section}">Back to ${section}</a>.</p>`;
    const p = items[i];
    const newer = items[i - 1];
    const older = items[i + 1];
    const link = (x, cls, label) => x
      ? `<a class="${cls}" href="#/${section}/${x.slug}"><small>${label}</small><span>${x.title}</span></a>` : "";
    return `
      <article>
        <a class="back" href="#/${section}">← ${section}</a>
        <h1>${p.title}</h1>
        <time>${p.date}</time>
        <div class="tags">${p.tags.map(t => tagLink(section, t)).join("")}</div>
        ${p.html}
        ${newer || older ? `<div class="pager">${link(newer, "newer", "newer")}${link(older, "older", "older")}</div>` : ""}
      </article>`;
  },
};

function render(animate = true) {
  const [path, query = ""] = location.hash.replace(/^#\/?/, "").split("?");
  const [section = "", slug] = path.split("/").filter(Boolean);
  const tag = new URLSearchParams(query).get("tag");
  let html;
  if (collections[section] && slug) html = views.post(section, slug);
  else if (views[section]) html = views[section](tag);
  else html = views.home();
  const main = document.getElementById("main");
  const swap = () => { main.innerHTML = html; window.scrollTo(0, 0); main.classList.remove("leaving"); };
  if (animate) { main.classList.add("leaving"); setTimeout(swap, 180); } else swap();
  document.querySelectorAll("nav a").forEach(a => {
    if (a.dataset.route === section) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
}

function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("theme", t); } catch {}
}
function initTheme() {
  let t;
  try { t = localStorage.getItem("theme"); } catch {}
  if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  setTheme(t);
}
document.getElementById("theme").addEventListener("click", () => {
  setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
});

const header = document.querySelector("header");
const headerSlot = document.querySelector(".header-slot");
const syncHeaderSlot = () => {
  headerSlot.style.height = `${header.getBoundingClientRect().height}px`;
};
new ResizeObserver(syncHeaderSlot).observe(header);
syncHeaderSlot();
let ticking = false;
function onScroll() {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    const y = scrollY;
    const on = header.classList.contains("scrolled");
    if (!on && y > 40) header.classList.add("scrolled");
    else if (on && y < 8) header.classList.remove("scrolled");
    ticking = false;
  });
}
addEventListener("scroll", onScroll, { passive: true });

const fmt = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Lisbon", hour: "2-digit", minute: "2-digit" });
function tick() {
  const el = document.getElementById("clock");
  if (el) el.textContent = fmt.format(new Date());
}
setInterval(tick, 15000);
tick();

initTheme();
render(false);
onScroll();
addEventListener("hashchange", render);
</script>
</body>
</html>
